name: deal-alert
on:
  schedule:
    - cron: "*/30 * * * *"   # each run watches ~58 min; the next run waits in the queue, so no gaps
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deal-alert
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR for price history
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr >/dev/null && pip install -q pillow
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: deal-state-${{ github.run_id }}
          restore-keys: deal-state-
      - run: python3 -u deals.py --loop 58
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: deal-state-${{ github.run_id }}
      - name: Save watchlist / settings
        if: always()
        run: |
          if [ -n "$(git status --porcelain settings.json)" ]; then
            git config user.name "dealalert-bot"; git config user.email "dealalert-bot@users.noreply.github.com"
            git add settings.json; git commit -m "Update settings"; git pull --rebase && git push
          fi
      - name: Tell me if the bot broke
        if: failure()
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="⚠️ Deal Alert bot lo error vachindi. Next run lo automatic ga malli start avutundi. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
