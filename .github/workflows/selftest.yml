name: selftest
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr >/dev/null && pip install -q pillow
      - run: |
          python3 -c "
          import history
          for a,exp in [('B0CTZX85DY',1090),('B0DTZ5HP8Q',168),('B09KH1ZDD1',88),('B0CNCQM7X1',1997)]:
              h=history.analyse(history.fetch_graph(a)); print('SELFTEST',a,exp,h and round(h['median']))
          import extras,tracker
          print('SELFTEST amazon cards', len(extras._cards(tracker._get('https://www.amazon.in/deals')[1])))
          "
